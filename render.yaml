services:
  - type: web
    name: workbuddy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/stats
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false

  - type: cron
    name: workbuddy-keepalive
    runtime: python
    plan: free
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python keepalive.py
    envVars:
      - key: APP_URL
        sync: false
